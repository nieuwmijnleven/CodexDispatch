[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-dispatch"
version = "0.1.0"
description = "Discord-based remote orchestration for Codex CLI sessions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "discord.py>=2.7.1,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[project.scripts]
codex-dispatch = "codex_dispatch.main:main"
codex-dispatch-notify = "codex_dispatch.notify_client:main"
codex-dispatch-stop-hook = "codex_dispatch.stop_hook_client:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
